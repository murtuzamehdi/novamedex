<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <rect width="600" height="500" rx="20" fill="#FFF5F5" stroke="#FED7D7" stroke-width="2"/>
  <g transform="translate(30, 30)">
    <rect width="180" height="36" rx="18" fill="#FEB2B2"/>
    <text x="90" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#9B2C2C" text-anchor="middle">WITHOUT NOVAMEDEX</text>
